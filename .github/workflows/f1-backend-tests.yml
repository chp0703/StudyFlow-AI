name: F1 backend verification

on:
  push:
    branches: [feat/f1-mvp-intergration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent acceptance dependencies
        run: python -m pip install -r backend/requirements-acceptance.txt
      - name: Validate approved contracts
        run: python -B contracts/check_contract.py
      - name: Verify application services
        run: python -B -m unittest discover -s tests -v
      - name: Verify scheduler and independent Sol regressions
        run: python -B -m unittest discover -s backend/tests -v
      - name: Evaluate fixed planner cases
        run: python -B backend/scripts/evaluate_planner.py
